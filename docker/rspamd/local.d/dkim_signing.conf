# Keys + selectors are written to redis by the app (src/lib/server/dkim.ts):
#   HGET DKIM_SELECTOR <domain>            -> selector
#   HGET DKIM_PRIVKEY  <selector>.<domain> -> private key (PEM)
use_redis = true;
key_prefix = "DKIM_PRIVKEY";
selector_prefix = "DKIM_SELECTOR";

sign_authenticated = true;
sign_local = false;
use_domain = "header";
use_esld = false;
# postfix already restricts who may send as which address (sender login maps)
allow_username_mismatch = true;
