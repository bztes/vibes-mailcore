# Dovecot 2.4 config. Replaces the image's default config completely.
# generated/*.conf (TLS paths, DB password, .env switches) is written by entrypoint.sh.
dovecot_config_version = 2.4.3
dovecot_storage_version = 2.4.3

protocols = imap lmtp
log_path = /dev/stdout

mail_uid = vmail
mail_gid = vmail
mail_driver = maildir
mail_home = /srv/vmail/%{user | domain}/%{user | username}
mail_path = ~/Maildir
mailbox_list_utf8 = yes
recipient_delimiter = +

# --- Logins: mailboxes from postgres (view mail_users) ---------------------
auth_mechanisms = plain login
auth_username_format = %{user | lower}
auth_allow_cleartext = no

sql_driver = pgsql
passdb sql {
  query = SELECT address AS "user", password FROM mail_users WHERE address = '%{user}'
}
userdb sql {
  query = SELECT quota_bytes || 'B' AS quota_storage_size FROM mail_users WHERE address = '%{user}'
  iterate_query = SELECT address AS "user" FROM mail_users
}

# --- Folders ---------------------------------------------------------------
namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  # Junk + Trash autoexpunge: generated/features.conf (DOVECOT_AUTO_DELETE_DAYS in .env)
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
}

# --- Quota (size per mailbox comes from userdb) -----------------------------
mail_plugins {
  quota = yes
}
quota "User quota" {
  driver = count
}

protocol imap {
  mail_plugins {
    imap_quota = yes
  }
}

# --- Delivery: postfix -> LMTP, spam goes to Junk ---------------------------
protocol lmtp {
  mail_plugins {
    sieve = yes
  }
}
lmtp_rcpt_check_quota = yes

sieve_script spam {
  type = before
  path = /etc/dovecot/sieve/spam-to-junk.sieve
}
sieve_script personal {
  type = personal
  path = ~/sieve
  active_path = ~/.dovecot.sieve
}

# --- Listeners -------------------------------------------------------------
service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

# Only reachable inside the compose network (not published).
service lmtp {
  inet_listener lmtp {
    port = 24
  }
}
service auth {
  inet_listener sasl {
    port = 12345
  }
}
service doveadm {
  inet_listener http {
    port = 8080
  }
}

ssl = required
ssl_min_protocol = TLSv1.2

!include generated/*.conf
