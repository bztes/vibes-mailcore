# Local recursive resolver for rspamd. It asks the root and authoritative
# servers itself, so DNS blocklists (Spamhaus etc.) see this server's IP instead
# of a shared resolver they refuse. Validates DNSSEC. Not published on any port.
server:
  interface: 0.0.0.0
  port: 53
  access-control: 127.0.0.0/8 allow
  access-control: 10.0.0.0/8 allow
  access-control: 172.16.0.0/12 allow
  access-control: 192.168.0.0/16 allow

  # Docker networks usually have no IPv6 route out; trying it only adds timeouts.
  do-ip6: no

  do-daemonize: no
  chroot: ""
  username: "unbound"
  directory: "/etc/unbound"
  pidfile: ""
  use-syslog: no
  logfile: ""
  verbosity: 1

  # From the dns-root-data package, updated with the image.
  root-hints: "/usr/share/dns/root.hints"
  trust-anchor-file: "/usr/share/dns/root.key"

  hide-identity: yes
  hide-version: yes
  prefetch: yes
